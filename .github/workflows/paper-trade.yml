
name: Update paper portfolios

on:
  schedule:
    - cron: '30 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python engine.py
      - name: Save simulation state
        run: |
          git config user.name 'paper-trading-bot'
          git config user.email 'paper-trading-bot@users.noreply.github.com'
          git add data/state.json
          git diff --cached --quiet || (git commit -m 'Update paper trading state' && git push)
